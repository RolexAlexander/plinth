[project]
name = "plinth"
version = "0.1.0"
description = "Turns discovery into a foundation downstream agents can build on"
authors = [{ name = "Rolex Alexander", email = "rolexalexander67@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "crewai[tools]>=0.177.0,<1.0.0",
    "pydantic>=2.0.0",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]


[project.scripts]
plinth = "requirements_crew.main:kickoff"
kickoff = "requirements_crew.main:kickoff"
plot = "requirements_crew.main:plot"

[project.urls]
Repository = "https://github.com/RolexAlexander/plinth"
Issues = "https://github.com/RolexAlexander/plinth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_crew"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
