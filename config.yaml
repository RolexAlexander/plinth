llm:
  # Cheapest model options for testing (e.g., within a $10 budget):
  # - Gemini 2.5 Flash-Lite: "gemini/gemini-2.5-flash-lite" (extremely cheap: $0.10 input / $0.40 output per 1M tokens)
  # - Gemini 2.5 Flash: "gemini/gemini-2.5-flash" ($0.30 input / $2.50 output per 1M tokens)
  default_model: "gemini/gemini-2.5-pro"
  render_model: "gemini/gemini-2.5-flash"

client_proxy:
  mode: auto                # on | off | auto
  grounding_threshold: 1500 # min chars of source material for `auto` to activate the proxy; below this it abstains

actor_critic:
  max_rounds: 3             # hard cap on revise loops
  stop_on: no_new_material_objections   # never "critic is satisfied"

research:
  enabled: true
  allowed_query_types: [compliance, domain_terminology, comparable_features]  # hard scope; reject others

validation:
  orphan_check: warn        # warn | fail

io:
  output_dir: ./output
